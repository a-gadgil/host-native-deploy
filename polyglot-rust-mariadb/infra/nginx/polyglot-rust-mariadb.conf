upstream polyglot-rm-go-backend {
    server 127.0.0.1:8090;
    keepalive 16;
}

upstream polyglot-rm-rust-backend {
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx-edge","stack":"polyglot-rust-mariadb"}';
    }

    location ^~ /internal/ {
        return 403;
    }

    location ^~ /api/v1/orders {
        proxy_pass http://polyglot-rm-go-backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location ^~ /api/v1/analytics {
        proxy_pass http://polyglot-rm-rust-backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/v1/go/readyz {
        proxy_pass http://polyglot-rm-go-backend/readyz;
    }

    location = /api/v1/rust/readyz {
        proxy_pass http://polyglot-rm-rust-backend/readyz;
    }
}
