[package]
name = "polyglot-rust-api"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
redis = { version = "0.29", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "macros"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
